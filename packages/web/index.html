<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Ведите учёт своих финансов с лёгкостью" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finnn" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/logo-dark.svg" type="image/svg+xml" sizes="any" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/logo-light.svg" type="image/svg+xml" sizes="any" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-icon.png" type="image/png" sizes="180x180" />
    <title>Finnn - Учёт финансов</title>
    <script>
      (() => {
        const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        let theme = systemPrefersDark ? "dark" : "light";

        try {
          const storedTheme = window.localStorage.getItem("theme");
          if (storedTheme === "light" || storedTheme === "dark") {
            theme = storedTheme;
          }
        } catch {}

        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script>
      (() => {
        const launchParams = new URLSearchParams(
          `${window.location.search.slice(1)}&${window.location.hash.slice(1)}`
        );
        const isTelegramMiniApp = launchParams.has("tgWebAppData") || launchParams.has("tgWebAppVersion");

        if (!isTelegramMiniApp) return;

        window.__finnnTelegramMiniAppSdkReady = new Promise((resolve) => {
          const script = document.createElement("script");
          script.src = "https://telegram.org/js/telegram-web-app.js";
          script.async = true;
          script.onload = () => resolve("loaded");
          script.onerror = () => resolve("failed");
          document.head.appendChild(script);
        });
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
