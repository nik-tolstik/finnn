services:
  postgres:
    image: postgres:17-alpine
    container_name: finnn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finnn
      POSTGRES_USER: finnn
      POSTGRES_PASSWORD: finnn_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finnn -d finnn"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
